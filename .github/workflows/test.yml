name: Test

on:
  push:
    branches: # on all branches except `typos`
      - "**"
      - "!typos"
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "data/**"
      - ".git*"
      - "README.md"
  pull_request:
    branches:
      - "**"
  schedule: # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"

jobs:
  caching:
    strategy:
      matrix:
        python-version: ["3.12", "3.15"]
        os: [ubuntu-latest]
      fail-fast: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: bash -elo pipefail {0}

    name: Cache for ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Get week number
        run: echo "WEEK=$(date +'%V')" >> $GITHUB_ENV

      - name: Set up Python ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v3
        with:
          create-args: python=${{ matrix.python-version }}
          environment-file: environment-dev.yml
          cache-environment: false
          # cache-environment-key: W${{ env.WEEK }}

  run-tests:
    needs: caching
    strategy:
      matrix:
        python-version: ["3.12", "3.15"]
        os: [ubuntu-latest]
        submodule:
          - { name: "growbikenet", pytest_args: "tests/test_growbikenet.py" }
          - { name: "functions", pytest_args: "tests/test_functions.py" }
          - { name: "visualization", pytest_args: "tests/test_visualization.py --mpl" }
      fail-fast: false

    name: ${{ matrix.submodule.name }} (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v7

      - name: Get week number
        run: echo "WEEK=$(date +'%V')" >> $GITHUB_ENV

      - name: Set up Python ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v3
        with:
          create-args: python=${{ matrix.python-version }}
          environment-file: environment-dev.yml
          cache-environment: false
          # cache-environment-key: W${{ env.WEEK }}

      - name: Install growbikenet
        run: pip install --no-build-isolation --no-deps -e .

      - name: "Run tests ${{ matrix.submodule.name }}"
        run: |
          pytest ${{ matrix.submodule.pytest_args }} --cov --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: BikeNetKit/GrowBikeNet