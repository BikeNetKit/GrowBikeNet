name: gbnenvdev
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - matplotlib=3.11.2 # The exact version is important for visualization tests
  - osmnx>=2
  - scipy
  - tqdm
  - geojson
  - bikenetlib>=0.9.0
  
  # additional to the non-dev env
  - ipykernel
  - ipywidgets
  - pytest
  - pytest-mpl
  - pytest-cov
  - sphinx
  - numpydoc
  - myst-nb
  - pre-commit
  - jupyterlab
  - pixi-kernel
  - sphinx-copybutton
  - sphinxext-opengraph
  - furo
  - growbikenet # For docs