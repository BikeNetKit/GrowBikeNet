name: gbnenvdev
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - matplotlib=3.11.0 # The exact version is important for visualization tests
  # - osmnx>=2
  - tqdm
  - geojson
  - scipy

  # additional to the non-dev env
  - ipykernel
  - pytest
  - pytest-mpl
  - pytest-cov
  - sphinx
  - numpydoc
  - myst-nb
  - nbsphinx
  - jupyter_sphinx
  - myst-parser
  - pre-commit
  - jupyterlab
  - pixi-kernel
  - pyosmium
  # - growbikenet=0.12.0
  - pip:
      # not available via conda-forge:
      - sphinx-copybutton
      - furo
      - osmnx @ git+https://github.com/gboeing/osmnx.git@pbf # temporary test of rc for pbf imports - remove once released and update osmnx version
      # - osmium # Use -pyosmium from conda-forge instead of osmium via pip