name: gbnenvdev
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - matplotlib=3.11.0 # The exact version is important for visualization tests
  - osmnx>=2
  - scipy
  - tqdm
  - geojson

  # additional to the non-dev env
  - ipykernel
  - ipywidgets
  - pytest
  - pytest-mpl
  - pytest-cov
  - sphinx
  - numpydoc
  - myst-nb
  - pre-commit
  - jupyterlab
  - pixi-kernel
  - growbikenet
  - pip:
      # not available via conda-forge:
      - sphinx-copybutton
      - furo
      - opencv-python # For the generate_video.py script